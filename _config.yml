# Site configuration
locale: "en-US"
title: "Anderson Sabogal"
title_separator: "-"
name: &name "Anderson Sabogal"
description: &description "Mechanical and Systems Engineer at IFMIF-DONES specializing in accelerator vacuum systems, fusion engineering, safety, controls and experimental R&D."
url: https://andimec.github.io
baseurl: ""
repository: "andimec/andimec.github.io"
teaser:
breadcrumbs: false
words_per_minute: 160
future: false
read_more: "disabled"
talkmap_link: false

comments:
  provider:

atom_feed:
  path:

# SEO
google_site_verification:
bing_site_verification:
alexa_site_verification:
yandex_site_verification:

twitter:
  username:
facebook:
  username:
  app_id:
  publisher:
og_image: "Anderson_LK.png"

social:
  type: "Person"
  name: "Anderson Sabogal"
  links:
    - "https://www.linkedin.com/in/andimec/"
    - "https://orcid.org/0000-0002-9911-9786"
    - "https://github.com/andimec"

analytics:
  provider: false
  google:
    tracking_id:

author:
  name: "Anderson Sabogal"
  avatar: "Anderson_LK.png"
  bio: "Mechanical and Systems Engineer | Vacuum Systems | Accelerator Technology | Fusion Engineering | Safety"
  location: "Japan / Spain"
  employer: "IFMIF-DONES"
  pubmed:
  googlescholar:
  email: "andymec3000@outlook.com"
  researchgate:
  uri: "https://orcid.org/0000-0002-9911-9786"
  github: "andimec"
  linkedin: "andimec"
  orcid: "https://orcid.org/0000-0002-9911-9786"

include:
  - .htaccess
  - _pages
  - files
  - stl-viewer
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - CHANGELOG
  - Capfile
  - Gemfile
  - Gruntfile.js
  - LICENSE
  - README
  - Rakefile
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - config
  - gulpfile.js
  - log
  - node_modules
  - package.json
  - tmp
  - vendor

keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

markdown: kramdown
highlighter: rouge
lsi: false
incremental: false
excerpt_separator: "\n\n"
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: true
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true

sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: Asia/Tokyo

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from
  - jemoji

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

compress_html:
  clippings: all
  ignore:
    envs: development
